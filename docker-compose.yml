services:
  # Bootstrap node with WebSocket bridge for browser clients
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libp2p-bootstrap
    command: ["node", "dist/cli/ws-bridge.js"]
    environment:
      - NODE_ID=bootstrap
      - IS_BOOTSTRAP=true
      - WS_PORT=8080
      - METRICS_PORT=9090
      - EXTERNAL_HOST=${EXTERNAL_HOST:-imeyouwe.com}
      - K_BUCKET_SIZE=20
      - MAX_CONNECTIONS=100
      - DEBUG=libp2p:kad-dht*,libp2p:ping*
    ports:
      - "4001:4001"   # libp2p TCP
      - "4002:4002"   # libp2p WebSocket
      - "8080:8080"   # Browser WebSocket API
      - "9090:9090"   # Metrics
    networks:
      - dht-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # DHT nodes - use deploy script to start multiple instances with unique NODE_INDEX
  # Each node gets a unique index for public address routing (e.g., /dht/node-1, /dht/node-2)
  # The deploy script creates individual containers: dht-node-1, dht-node-2, etc.
  dht-node:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/cli/node.js"]
    environment:
      - NODE_ID=node-${NODE_INDEX:-1}
      - NODE_INDEX=${NODE_INDEX:-1}
      - LISTEN_PORT=4001
      - METRICS_PORT=9090
      - EXTERNAL_HOST=${EXTERNAL_HOST:-imeyouwe.com}
      - PUBLIC_PATH=/dht/node-${NODE_INDEX:-1}
      - BOOTSTRAP_URL=ws://bootstrap:4002
      - K_BUCKET_SIZE=20
      - MAX_CONNECTIONS=50
      - DEBUG=libp2p:kad-dht*,libp2p:ping*
    networks:
      - dht-network
    depends_on:
      bootstrap:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx reverse proxy for WSS
  webserver:
    image: nginx:alpine
    container_name: libp2p-webserver
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/dht-nodes.conf:/etc/nginx/dht-nodes.conf:ro
      - ./nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./public:/usr/share/nginx/html:ro
    networks:
      - dht-network
    depends_on:
      - bootstrap
    restart: unless-stopped
    # Increase file descriptor limits for WebSocket connections
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  dht-network:
    driver: bridge
