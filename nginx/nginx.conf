# Map to determine connection type based on upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name _;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Docker DNS resolver for dynamic hostname resolution
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # SSL certificate paths (mounted from host)
    ssl_certificate /etc/letsencrypt/live/imeyouwe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imeyouwe.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # WebSocket proxy for bootstrap server
    # Browser nodes connect via multiaddr with http-path=/ws
    location /ws {
        set $bootstrap_upstream libp2p-bootstrap:8080;
        proxy_pass http://$bootstrap_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Bootstrap node info endpoint
    location /bootstrap/info {
        set $bootstrap_upstream libp2p-bootstrap:9090;
        proxy_pass http://$bootstrap_upstream/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Bootstrap node metrics
    location /bootstrap/metrics {
        set $bootstrap_upstream libp2p-bootstrap:9090;
        proxy_pass http://$bootstrap_upstream/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Browser node configuration endpoint
    location /browser/config {
        set $bootstrap_upstream libp2p-bootstrap:9090;
        proxy_pass http://$bootstrap_upstream/browser/config;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }

    # Relay status endpoint
    location /relay/status {
        set $bootstrap_upstream libp2p-bootstrap:9090;
        proxy_pass http://$bootstrap_upstream/relay/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }

    # Include generated DHT node routing configuration
    # This provides /dht/node-N endpoints for each DHT node
    include /etc/nginx/dht-nodes.conf;

    # Root location - serve static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
