# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name _;

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Docker DNS resolver for dynamic hostname resolution
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # SSL certificate paths (mounted from host)
    ssl_certificate /etc/letsencrypt/live/imeyouwe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imeyouwe.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # WebSocket proxy for bootstrap server (main entry point)
    location /ws {
        set $bootstrap_upstream libp2p-bootstrap:8080;
        proxy_pass http://$bootstrap_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Bootstrap node info endpoint
    location /bootstrap/info {
        set $bootstrap_upstream libp2p-bootstrap:9090;
        proxy_pass http://$bootstrap_upstream/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Bootstrap node metrics
    location /bootstrap/metrics {
        set $bootstrap_upstream libp2p-bootstrap:9090;
        proxy_pass http://$bootstrap_upstream/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Default - serve static files or 404
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
