# ============================================
# Upstream definitions for DHT nodes
# ============================================

upstream dht-node-1 {
    server libp2p-dht-dht-node-1:4001;
}

upstream dht-node-2 {
    server libp2p-dht-dht-node-2:4001;
}

upstream dht-node-3 {
